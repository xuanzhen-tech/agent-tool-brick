name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@xuanzhen-tech"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spreadsheet runtime dependencies
        run: python -m pip install openpyxl==3.1.5

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Validate ecommerce media runtimes
        run: |
          node --check src/main/ecommerce-image-runtime.mjs
          node --check src/main/ecommerce-video-runtime.mjs
          node --check src/main/server-tool-gateway.mjs
          node --check src/scripts/smoke-ecommerce-images.mjs
          node --check src/scripts/smoke-ecommerce-videos.mjs

      - name: Validate spreadsheet runtimes
        run: |
          node --check src/main/spreadsheet-runtime.mjs
          node --check src/main/visualization-runtime.mjs
          node --check src/scripts/smoke-spreadsheets.mjs
          python -m py_compile src/main/spreadsheet-worker.py src/scripts/create-spreadsheet-fixtures.py

      - name: Run contract smoke tests
        run: |
          npm run smoke:contract
          npm run smoke:ecommerce-images
          npm run smoke:ecommerce-videos
          npm run smoke:spreadsheets
          npm run smoke:tools

      - name: Verify package
        run: |
          npm run build:artifact
          npm run create:descriptor
          npm run verify
          npm run pack:dry-run
